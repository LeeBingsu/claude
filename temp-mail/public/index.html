<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>임시 메일함</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%AC%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand"><span aria-hidden="true">📬</span> 임시 메일함</h1>
      <div class="topbar-actions">
        <button id="share-btn" class="btn btn-ghost" type="button" title="다른 기기에서 열 수 있는 링크를 복사합니다">
          공유 링크
        </button>
        <button id="theme-btn" class="btn btn-ghost" type="button" aria-label="테마 전환">🌗</button>
      </div>
    </header>

    <!-- 주소가 아직 없을 때 -->
    <section id="setup" class="setup" hidden>
      <h2>일회용 주소 만들기</h2>
      <p class="muted">
        가입 확인 메일처럼 한 번 받고 버릴 메일에 쓰는 주소입니다. 정해진 시간이 지나면
        주소와 받은 메일이 함께 사라집니다.
      </p>

      <form id="create-form" class="create-form">
        <div class="field">
          <label for="local-part">주소 (비워 두면 자동 생성)</label>
          <div class="address-input">
            <input
              id="local-part"
              name="localPart"
              type="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="자동 생성"
              maxlength="32"
            />
            <span class="at">@</span>
            <select id="domain" name="domain"></select>
          </div>
          <p class="hint">영문 소문자·숫자로 시작하고 끝나며, 사이에 <code>. _ -</code> 를 쓸 수 있습니다.</p>
        </div>

        <button id="create-btn" class="btn btn-primary" type="submit">주소 만들기</button>
      </form>

      <details class="restore">
        <summary>이전에 쓰던 주소 복구하기</summary>
        <p class="hint">
          주소와 함께 발급된 토큰이 있어야 메일을 읽을 수 있습니다. 공유 링크를 그대로 열어도 됩니다.
        </p>
        <form id="restore-form" class="restore-form">
          <input id="restore-address" type="text" placeholder="주소 (name@example.com)" autocomplete="off" spellcheck="false" />
          <input id="restore-token" type="text" placeholder="토큰" autocomplete="off" spellcheck="false" />
          <button class="btn" type="submit">불러오기</button>
        </form>
      </details>
    </section>

    <!-- 주소가 있을 때 -->
    <main id="app" class="app" hidden>
      <section class="address-bar">
        <div class="address-block">
          <span class="label">내 주소</span>
          <button id="address" class="address" type="button" title="눌러서 복사"></button>
        </div>
        <div class="address-meta">
          <span id="expiry" class="expiry"></span>
          <button id="extend-btn" class="btn btn-small" type="button">시간 연장</button>
          <button id="new-btn" class="btn btn-small" type="button">새 주소</button>
          <button id="destroy-btn" class="btn btn-small btn-danger" type="button">삭제</button>
        </div>
      </section>

      <div class="panes">
        <section class="list-pane" aria-label="받은 메일">
          <div class="list-head">
            <span id="list-count" class="muted"></span>
            <span id="poll-state" class="poll-state" title="자동 새로고침 상태"></span>
            <button id="refresh-btn" class="btn btn-small" type="button">새로고침</button>
          </div>
          <ul id="message-list" class="message-list"></ul>
          <div id="empty" class="empty">
            <div class="empty-icon" aria-hidden="true">📭</div>
            <p>아직 도착한 메일이 없습니다.</p>
            <p class="muted">위 주소로 메일을 보내면 몇 초 안에 여기에 나타납니다.</p>
          </div>
        </section>

        <section id="reader" class="reader-pane" aria-label="메일 내용">
          <div id="reader-placeholder" class="reader-placeholder">
            <p class="muted">왼쪽에서 메일을 선택하세요.</p>
          </div>

          <article id="reader-content" hidden>
            <header class="reader-head">
              <h2 id="reader-subject"></h2>
              <div class="reader-from">
                <span id="reader-sender"></span>
                <time id="reader-date"></time>
              </div>
              <div class="reader-tools">
                <span id="reader-auth" class="auth-badges"></span>
                <button id="images-btn" class="btn btn-small" type="button" hidden>이미지 표시</button>
                <button id="raw-btn" class="btn btn-small" type="button">원문 보기</button>
                <button id="delete-msg-btn" class="btn btn-small btn-danger" type="button">삭제</button>
              </div>
              <ul id="attachments" class="attachments"></ul>
            </header>

            <iframe
              id="reader-frame"
              class="reader-frame"
              title="메일 본문"
              sandbox="allow-popups allow-popups-to-escape-sandbox"
              referrerpolicy="no-referrer"
            ></iframe>
            <pre id="reader-text" class="reader-text" hidden></pre>
          </article>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/app.js"></script>
  </body>
</html>
