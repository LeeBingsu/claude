# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# Loom is not configuration-cache compatible yet.
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# Taken from FabricMC/fabric-example-mod branch 1.21.11, which is the reference
# set for this Minecraft version.
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Yarn rather than the example mod's officialMojangMappings(): this mod's source
# is written against yarn names. Yarn 1.21.11 is the last yarn release, so a
# future Minecraft version will force a move to Mojang mappings and a rename of
# every API call in the mod.
yarn_mappings=1.21.11+build.3

# Mod Properties
mod_version=1.0.0
maven_group=net.jihoon
archives_base_name=mace-stun-slam

# Dependencies
fabric_version=0.141.6+1.21.11
