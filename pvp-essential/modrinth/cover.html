<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{
  font-family:"DejaVu Sans","Noto Sans",system-ui,sans-serif;
  background:#0e1013;color:#fff;position:relative;
}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:32px 32px;}
.glowr{position:absolute;right:-160px;top:-160px;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,#e5313166,transparent 62%);filter:blur(8px)}
.glowb{position:absolute;left:-200px;bottom:-220px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,#2f6be544,transparent 62%);filter:blur(8px)}
.slash{position:absolute;right:0;top:0;bottom:0;width:52%;
  background:linear-gradient(120deg,transparent 0 34%,#e5313122 34% 36%,transparent 36% 46%,#e5313114 46% 47%,transparent 47%);}
.wrap{position:absolute;inset:0;padding:70px 78px;display:flex;flex-direction:column;justify-content:center}
.kicker{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.kicker .dot{width:12px;height:12px;background:#e53131;box-shadow:0 0 0 4px #e5313133}
.kicker span{letter-spacing:.42em;font-size:19px;font-weight:700;color:#c9ced6;text-transform:uppercase}
h1{font-size:132px;line-height:.92;font-weight:900;letter-spacing:-3px}
h1 .p{color:#fff}
h1 .v{color:#e53131;text-shadow:0 6px 0 #7a1414}
.sub{margin-top:22px;font-size:31px;font-weight:600;color:#e7eaee}
.chips{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.chip{background:#ffffff0e;border:1px solid #ffffff1c;border-radius:10px;padding:12px 18px;font-size:22px;font-weight:700;color:#eef1f4;display:flex;gap:10px;align-items:center}
.ver{position:absolute;top:64px;right:78px;background:#e53131;color:#fff;font-weight:900;font-size:26px;
  padding:14px 26px;border-radius:12px;box-shadow:0 8px 0 #7a1414;letter-spacing:.5px}
.foot{position:absolute;left:78px;bottom:56px;font-size:23px;font-weight:700;color:#aeb4bd;letter-spacing:.5px}
.foot b{color:#fff}
</style></head><body>
<div class="grid"></div><div class="glowr"></div><div class="glowb"></div><div class="slash"></div>
<div class="ver">1.21.11 → 26.2+</div>
<div class="wrap">
  <div class="kicker"><div class="dot"></div><span>Vanilla Datapack · Server-side</span></div>
  <h1><span class="p">PvP</span> <span class="v">ESSENTIAL</span></h1>
  <div class="sub">A balanced multiplayer PvP ruleset — no mods, no plugins.</div>
  <div class="chips">
    <div class="chip">⚔️ Combat-log = death</div>
    <div class="chip">🔱 Lunge / ⚒️ Mace cooldowns</div>
    <div class="chip">💥 Crystal &amp; anchor nullified</div>
    <div class="chip">🍏 Custom crafts</div>
  </div>
</div>
<div class="foot"><b>PvP Essential</b>  ·  balanced &amp; future-proof</div>
</body></html>
