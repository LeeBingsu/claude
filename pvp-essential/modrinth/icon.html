<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px;overflow:hidden}
body{font-family:"DejaVu Sans","Noto Sans",system-ui,sans-serif;
  background:radial-gradient(circle at 50% 34%,#22262d,#0d0f12);position:relative;color:#fff}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);
  background-size:32px 32px}
.ring{position:absolute;inset:26px;border:6px solid #e5313155;border-radius:34px}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sw{font-size:150px;line-height:1;filter:drop-shadow(0 6px 10px #000a)}
.t{margin-top:2px;font-weight:900;letter-spacing:-2px;line-height:.86;text-align:center}
.t .a{font-size:118px;color:#fff}
.t .b{font-size:60px;color:#e53131;text-shadow:0 4px 0 #7a1414;letter-spacing:2px}
</style></head><body>
<div class="grid"></div><div class="ring"></div>
<div class="c">
  <div class="sw">⚔️</div>
  <div class="t"><div class="a">PvP</div><div class="b">ESSENTIAL</div></div>
</div>
</body></html>
