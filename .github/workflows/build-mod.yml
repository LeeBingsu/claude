name: Build Fabric mod

on:
  push:
    branches: ['**']
    paths:
      - 'minecraft-mace-stun-slam/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'minecraft-mace-stun-slam/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: minecraft-mace-stun-slam

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The repo has gradle-wrapper.properties but no gradlew/gradle-wrapper.jar,
      # so Gradle is installed here instead of invoking a wrapper that isn't there.
      # The version matches what gradle-wrapper.properties declares.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Show resolved versions
        run: |
          echo "--- gradle.properties ---"
          cat gradle.properties
          gradle --version

      - name: Build
        run: gradle build --stacktrace

      - name: List build output
        if: success()
        run: ls -la build/libs

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mace-stun-slam-jar
          # Paths are relative to the workspace root, not working-directory.
          # The remapped jar is the one that goes in .minecraft/mods; the
          # -dev and -sources jars are excluded.
          path: |
            minecraft-mace-stun-slam/build/libs/*.jar
            !minecraft-mace-stun-slam/build/libs/*-dev.jar
            !minecraft-mace-stun-slam/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      # Loom failures usually explain themselves in the console, but mixin and
      # remap problems leave their detail in these reports.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            minecraft-mace-stun-slam/build/reports/
            minecraft-mace-stun-slam/build/tmp/
          if-no-files-found: ignore
          retention-days: 7
