name: Build Fabric mods

on:
  push:
    branches: ['**']
    paths:
      - 'minecraft-mace-stun-slam/**'
      - 'minecraft-sword-hold-attack/**'
      - 'minecraft-map-license/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'minecraft-mace-stun-slam/**'
      - 'minecraft-sword-hold-attack/**'
      - 'minecraft-map-license/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One mod failing should not hide the other's result.
      fail-fast: false
      matrix:
        mod:
          - minecraft-mace-stun-slam
          - minecraft-sword-hold-attack
          - minecraft-map-license

    name: build (${{ matrix.mod }})

    defaults:
      run:
        working-directory: ${{ matrix.mod }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Only minecraft-map-license ships a full wrapper; the other two have
      # gradle-wrapper.properties without gradlew/gradle-wrapper.jar. Installing
      # Gradle directly covers all three. The version matches what the wrapper
      # properties declare, and Loom for 1.21.11 requires well above the 8.x line.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Show resolved versions
        run: |
          echo "--- gradle.properties ---"
          cat gradle.properties
          gradle --version

      # The plaintext activation codes are the one secret this design has, and
      # they only exist on the author's machine. Committing a batch would publish
      # every unsold code to anyone who can read the repository, so fail loudly
      # rather than build a release around a leak.
      - name: Check no plaintext activation codes were committed
        if: matrix.mod == 'minecraft-map-license'
        run: |
          if ls tools/codes*.txt >/dev/null 2>&1; then
            echo "::error::Plaintext activation codes are present in tools/. Remove them, treat the batch as burned, and mint a new one."
            exit 1
          fi
          echo "No plaintext code files present."

      - name: Build
        run: gradle build --stacktrace

      - name: List build output
        if: success()
        run: ls -la build/libs

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.mod }}-jar
          # Paths are relative to the workspace root, not working-directory.
          # The remapped jar is the one that goes in .minecraft/mods; the
          # -dev and -sources jars are excluded.
          path: |
            ${{ matrix.mod }}/build/libs/*.jar
            !${{ matrix.mod }}/build/libs/*-dev.jar
            !${{ matrix.mod }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      # Loom failures usually explain themselves in the console, but mixin and
      # remap problems leave their detail in these reports.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.mod }}-build-reports
          path: |
            ${{ matrix.mod }}/build/reports/
            ${{ matrix.mod }}/build/tmp/
          if-no-files-found: ignore
          retention-days: 7
