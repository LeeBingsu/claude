# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# Loom is not configuration-cache compatible yet.
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# Matched to minecraft-mace-stun-slam, which tracks FabricMC/fabric-example-mod
# branch 1.21.11.
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Yarn rather than officialMojangMappings(): this mod's source is written
# against yarn names, same as the other mods in this repository.
yarn_mappings=1.21.11+build.3

# Mod Properties
mod_version=1.0.0
maven_group=net.jihoon
archives_base_name=map-license

# Dependencies
fabric_version=0.141.6+1.21.11
